<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Prime Translado</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<link rel="stylesheet" href="/css/style.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root {
    --navy: #14213D;
    --navy-2: #1D3160;
    --gold: #D4A64A;
    --gold-light: #F0C97A;
  }

  body {
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
    background: #F4F3EF;
    margin: 0;
    padding: 24px;
  }

  .pagina {
    max-width: 1100px;
    margin: 0 auto;
  }

  .topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .topo h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0;
    color: var(--navy);
  }

  .topo .acoes-topo {
    display: flex;
    gap: 10px;
  }

  a.btn, button {
    font-size: 13.5px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.15s;
  }

  .btn-primario {
    background: var(--navy);
    color: #fff;
  }

  .btn-primario:hover {
    background: var(--navy-2);
  }

  .btn-secundario {
    background: #fff;
    color: var(--navy);
    border: 1px solid #e2e2e2;
  }

  .nav-abas {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .nav-abas a {
    font-size: 13.5px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 20px;
    text-decoration: none;
    color: var(--navy);
    background: #fff;
    border: 1px solid #e2e2e2;
  }

  .nav-abas a.ativa {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }

  .filtros {
    background: #ffffff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    gap: 12px;
    box-shadow: 0 1px 3px rgba(20,33,61,0.08);
    flex-wrap: wrap;
  }

  .filtros input {
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-family: inherit;
  }

  .filtros input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .filtros input#busca {
    flex: 1;
    min-width: 200px;
  }

  .grafico-container {
    background: #ffffff;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(20,33,61,0.08);
  }

  .grafico-container h2 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 12px 0;
    color: var(--navy);
  }

  .grafico-vazio {
    color: #888;
    font-size: 13.5px;
  }

  .tabela-container {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(20,33,61,0.08);
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
    white-space: nowrap;
  }

  th {
    background: var(--navy);
    font-weight: 700;
    color: #fff;
  }

  tr:hover td {
    background: #FBF7EE;
  }

  .col-acoes {
    display: flex;
    gap: 6px;
  }

  .col-acoes button {
    padding: 6px 10px;
    font-size: 12px;
    background: var(--navy);
    color: #fff;
  }

  .col-acoes button.cliente {
    background: var(--gold);
  }

  .col-acoes button.excluir {
    background: #a02020;
  }

  .col-acoes a.editar {
    background: #fff;
    color: var(--navy);
    border: 1px solid var(--navy);
    font-weight: 700;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    text-decoration: none;
  }

  .col-acoes button:disabled {
    background: #bbb;
    cursor: not-allowed;
  }

  .estado-vazio, .estado-carregando {
    padding: 40px;
    text-align: center;
    color: #888;
  }

  .mensagem-erro {
    margin-bottom: 16px;
    padding: 10px 14px;
    background: #fbeaea;
    border: 1px solid #e6a5a5;
    border-radius: 6px;
    color: #a02020;
    display: none;
  }

  .mensagem-erro.mostrar {
    display: block;
  }

  .badge-transportador {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    background: var(--navy);
    color: var(--gold-light);
    font-size: 12px;
    font-weight: 700;
  }

  /* ---------- Responsivo (celular) ---------- */
  @media (max-width: 640px) {
    body {
      padding: 12px;
    }

    .topo {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .topo h1 {
      font-size: 19px;
    }

    .topo .acoes-topo {
      width: 100%;
    }

    .topo .acoes-topo a.btn,
    .topo .acoes-topo button {
      flex: 1;
      text-align: center;
    }

    .filtros {
      flex-direction: column;
    }

    .filtros input#busca,
    .filtros input[type="date"] {
      width: 100%;
    }

    .grafico-container {
      padding: 14px;
    }

    /* A tabela continua rolando de lado (já preparada pra isso);
       só deixamos texto e espaçamento mais compactos */
    th, td {
      padding: 8px 10px;
      font-size: 12.5px;
    }

    .col-acoes {
      flex-wrap: nowrap;
    }
  }
</style>
</head>
<body>
<div class="pagina">

  <div class="topo">
    <h1>Vouchers</h1>
    <div class="acoes-topo">
      <a class="btn btn-primario" href="/novo-voucher.html">+ Novo voucher</a>
      <button class="btn-secundario" id="btn-sair">Sair</button>
    </div>
  </div>

  <div class="nav-abas">
    <a href="/dashboard.html" class="ativa">Vouchers</a>
    <a href="/agendamento.html">Agenda</a>
  </div>

  <div class="mensagem-erro" id="mensagem-erro"></div>

  <div class="filtros">
    <input type="text" id="busca" placeholder="Buscar por cliente, agência ou transportador...">
    <input type="date" id="filtro-data-de" title="Data da ida, a partir de">
    <input type="date" id="filtro-data-ate" title="Data da ida, até">
  </div>

  <div class="grafico-container">
    <h2>Top 10 destinos mais realizados</h2>
    <canvas id="grafico-destinos" height="90"></canvas>
    <div class="grafico-vazio" id="grafico-vazio" style="display:none;">Ainda não há dados suficientes.</div>
  </div>

  <div class="tabela-container">
    <div class="estado-carregando" id="estado-carregando">Carregando vouchers...</div>
    <table id="tabela-vouchers" style="display:none;">
      <thead>
        <tr>
          <th>N°</th>
          <th>Cliente</th>
          <th>Agência</th>
          <th>Transportador</th>
          <th>Data ida</th>
          <th>Data volta</th>
          <th>Valor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela"></tbody>
    </table>
    <div class="estado-vazio" id="estado-vazio" style="display:none;">Nenhum voucher encontrado.</div>
  </div>

</div>

<script type="module">
  import { requireAuth, logout } from '/js/auth.js';
  import { listarVouchers, excluirVoucher } from '/js/voucher.js';
  import { gerarPDF } from '/js/pdf-generator.js';

  await requireAuth();

  const inputBusca = document.getElementById('busca');
  const inputDataDe = document.getElementById('filtro-data-de');
  const inputDataAte = document.getElementById('filtro-data-ate');
  const corpoTabela = document.getElementById('corpo-tabela');
  const tabela = document.getElementById('tabela-vouchers');
  const estadoCarregando = document.getElementById('estado-carregando');
  const estadoVazio = document.getElementById('estado-vazio');
  const divErro = document.getElementById('mensagem-erro');
  const btnSair = document.getElementById('btn-sair');

  let todosVouchers = [];

  function mostrarErro(mensagem) {
    divErro.textContent = mensagem;
    divErro.classList.add('mostrar');
  }

  function formatarDataBr(dataISO) {
    if (!dataISO) return '—';
    const [ano, mes, dia] = dataISO.split('-');
    return `${dia}/${mes}/${ano}`;
  }

  function formatarValor(valor) {
    if (valor === null || valor === undefined) return '—';
    return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  }

  function vouchersFiltrados() {
    const termo = inputBusca.value.trim().toLowerCase();
    const dataDe = inputDataDe.value || null;
    const dataAte = inputDataAte.value || null;

    return todosVouchers.filter((v) => {
      if (termo) {
        const alvo = [
          v.cliente?.nome,
          v.agencia_nome,
          v.transportador?.nome,
        ].filter(Boolean).join(' ').toLowerCase();
        if (!alvo.includes(termo)) return false;
      }
      if (dataDe && (!v.data_ida || v.data_ida < dataDe)) return false;
      if (dataAte && (!v.data_ida || v.data_ida > dataAte)) return false;
      return true;
    });
  }

  function renderizarTabela() {
    const lista = vouchersFiltrados();
    corpoTabela.innerHTML = '';

    if (lista.length === 0) {
      tabela.style.display = 'none';
      estadoVazio.style.display = 'block';
      return;
    }

    estadoVazio.style.display = 'none';
    tabela.style.display = 'table';

    for (const voucher of lista) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${voucher.numero}</td>
        <td>${voucher.cliente?.nome ?? '—'}</td>
        <td>${voucher.agencia_nome ?? '—'}</td>
        <td><span class="badge-transportador">${voucher.transportador?.nome ?? '—'}</span></td>
        <td>${formatarDataBr(voucher.data_ida)}</td>
        <td>${formatarDataBr(voucher.data_volta)}</td>
        <td>${formatarValor(voucher.valor)}</td>
        <td>
          <div class="col-acoes">
            <a class="editar" href="/novo-voucher.html?id=${voucher.id}">Editar</a>
            <button data-id="${voucher.id}" data-tipo="agencia">PDF agência</button>
            <button data-id="${voucher.id}" data-tipo="cliente" class="cliente">PDF motorista</button>
            <button data-id="${voucher.id}" class="excluir botao-excluir">Excluir</button>
          </div>
        </td>
      `;
      corpoTabela.appendChild(tr);
    }

    corpoTabela.querySelectorAll('button[data-tipo]').forEach((botao) => {
      botao.addEventListener('click', async () => {
        const id = botao.dataset.id;
        const tipo = botao.dataset.tipo;
        const voucher = todosVouchers.find((v) => v.id === id);
        if (!voucher) return;

        botao.disabled = true;
        const textoOriginal = botao.textContent;
        botao.textContent = 'Gerando...';

        try {
          await gerarPDF(voucher, tipo);
        } catch (erro) {
          console.error(erro);
          mostrarErro(`Erro ao gerar PDF: ${erro.message}`);
        } finally {
          botao.disabled = false;
          botao.textContent = textoOriginal;
        }
      });
    });

    corpoTabela.querySelectorAll('button.botao-excluir').forEach((botao) => {
      botao.addEventListener('click', async () => {
        const id = botao.dataset.id;
        const voucher = todosVouchers.find((v) => v.id === id);
        if (!voucher) return;

        const confirmou = window.confirm(
          `Excluir o voucher nº ${voucher.numero} (${voucher.cliente?.nome ?? 'sem nome'})? Essa ação não pode ser desfeita.`
        );
        if (!confirmou) return;

        botao.disabled = true;
        const textoOriginal = botao.textContent;
        botao.textContent = 'Excluindo...';

        try {
          await excluirVoucher(id);
          todosVouchers = todosVouchers.filter((v) => v.id !== id);
          renderizarTabela();
        } catch (erro) {
          console.error(erro);
          mostrarErro(`Erro ao excluir voucher: ${erro.message}`);
          botao.disabled = false;
          botao.textContent = textoOriginal;
        }
      });
    });
  }

  function renderizarGraficoDestinos(vouchers) {
    const canvas = document.getElementById('grafico-destinos');
    const vazio = document.getElementById('grafico-vazio');

    const contagem = {};
    for (const v of vouchers) {
      const destino = (v.destino_ida || '').trim();
      if (!destino) continue;
      const chave = destino.toLowerCase();
      if (!contagem[chave]) contagem[chave] = { nome: destino, total: 0 };
      contagem[chave].total += 1;
    }

    const top10 = Object.values(contagem)
      .sort((a, b) => b.total - a.total)
      .slice(0, 10);

    if (top10.length === 0) {
      canvas.style.display = 'none';
      vazio.style.display = 'block';
      return;
    }

    canvas.style.display = 'block';
    vazio.style.display = 'none';

    new Chart(canvas, {
      type: 'bar',
      plugins: [ChartDataLabels],
      data: {
        labels: top10.map((d) => d.nome),
        datasets: [{
          label: 'Viagens',
          data: top10.map((d) => d.total),
          backgroundColor: '#14213D',
          borderRadius: 4,
        }],
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        layout: {
          padding: { right: 28 },
        },
        plugins: {
          legend: { display: false },
          datalabels: {
            anchor: 'end',
            align: 'end',
            color: '#14213D',
            font: { weight: '700', size: 12 },
            formatter: (valor) => valor,
          },
        },
        scales: {
          x: { ticks: { precision: 0 }, beginAtZero: true },
        },
      },
    });
  }

  [inputBusca, inputDataDe, inputDataAte].forEach((el) => {
    el.addEventListener('input', renderizarTabela);
  });

  btnSair.addEventListener('click', () => logout());

  try {
    todosVouchers = await listarVouchers();
    estadoCarregando.style.display = 'none';
    renderizarTabela();

    try {
      renderizarGraficoDestinos(todosVouchers);
    } catch (erroGrafico) {
      console.error('Gráfico de destinos falhou (lista de vouchers carregou normalmente):', erroGrafico);
    }
  } catch (erro) {
    console.error(erro);
    estadoCarregando.style.display = 'none';
    mostrarErro('Não foi possível carregar os vouchers: ' + erro.message);
  }
</script>
</body>
</html>
