<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ALS Trip Receptivo</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@700&display=swap');

  :root {
    --navy: #14532D;
    --navy-2: #166534;
    --gold: #22C55E;
    --gold-light: #86EFAC;
  }

  body {
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy) 100%);
    margin: 0;
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-login {
    position: relative;
    background: #ffffff;
    border-radius: 18px;
    padding: 38px 30px 30px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  .accent-login {
    position: absolute;
    top: -50px;
    left: -50px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    z-index: 0;
  }

  .card-login form, .card-login h1, .card-login .subtitulo {
    position: relative;
    z-index: 1;
  }

  .card-login h1 {
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    margin: 0;
    color: var(--navy);
    letter-spacing: 0.5px;
  }

  .card-login .cursiva-login {
    position: relative;
    z-index: 1;
    text-align: center;
    font-family: 'Dancing Script', cursive;
    font-size: 20px;
    color: var(--gold);
    margin-top: -4px;
  }

  .card-login .subtitulo {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin: 10px 0 24px 0;
  }

  .campo-form {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 14px;
  }

  label {
    font-size: 12.5px;
    font-weight: 600;
    color: #333;
  }

  input {
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: inherit;
    transition: border-color 0.15s;
  }

  input:focus {
    outline: none;
    border-color: var(--gold);
  }

  button {
    width: 100%;
    margin-top: 8px;
    font-size: 14px;
    font-weight: 700;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--navy);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover:not(:disabled) {
    background: var(--navy-2);
  }

  button:disabled {
    background: #9aa3b5;
    cursor: not-allowed;
  }

  .mensagem-erro {
    margin-top: 14px;
    padding: 10px 12px;
    background: #fbeaea;
    border: 1px solid #e6a5a5;
    border-radius: 6px;
    color: #a02020;
    font-size: 13px;
    display: none;
  }

  .mensagem-erro.mostrar {
    display: block;
  }
</style>
</head>
<body>

<div class="card-login">
  <div class="accent-login"></div>
  <h1>VOUCHER</h1>
  <div class="cursiva-login">Receptivo</div>
  <div class="subtitulo">Acesso ao sistema de vouchers</div>

  <form id="form-login">
    <div class="campo-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">
    </div>
    <div class="campo-form">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required autocomplete="current-password">
    </div>
    <button type="submit" id="btn-entrar">Entrar</button>
    <div class="mensagem-erro" id="mensagem-erro"></div>
  </form>
</div>

<script type="module">
  import { login, getSession } from '/js/auth.js';

  const form = document.getElementById('form-login');
  const btnEntrar = document.getElementById('btn-entrar');
  const divErro = document.getElementById('mensagem-erro');

  // Se já tem sessão ativa, não precisa logar de novo
  const sessaoAtual = await getSession();
  if (sessaoAtual) {
    window.location.href = '/dashboard.html';
  }

  form.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    divErro.classList.remove('mostrar');
    btnEntrar.disabled = true;
    btnEntrar.textContent = 'Entrando...';

    try {
      await login(
        document.getElementById('email').value.trim(),
        document.getElementById('senha').value
      );
      window.location.href = '/dashboard.html';
    } catch (erro) {
      console.error(erro);
      divErro.textContent = 'Email ou senha inválidos.';
      divErro.classList.add('mostrar');
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
